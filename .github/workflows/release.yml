name: release
# Builds the Windows installer with the bundled runtime from the tagged revision and
# attaches it, its SHA-256, the update feed (latest.json), the SBOM and third-party notices to a DRAFT release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      # The installer does not carry the separation runtime: the app downloads the pack pinned in worker/models.json,
      # so a release needs that pack published (pack.yml on a pack-separation-v<N> tag) and pinned (scripts/pin_pack.py).
      - name: The separation pack is published and pinned
        shell: pwsh
        run: |
          $entry = ((Get-Content worker/models.json -Raw -Encoding utf8 | ConvertFrom-Json).models | Where-Object id -eq 'separation-runtime')
          if (-not $entry.pack.size -or $entry.pack.sha256 -match '^0+$') { throw 'worker/models.json still has the placeholder pin of the separation pack: publish a pack-separation-v<N> tag and run scripts/pin_pack.py.' }
          $head = Invoke-WebRequest -Uri $entry.pack.url -Method Head -MaximumRedirection 5
          if ([long]$head.Headers['Content-Length'] -ne $entry.pack.size) { throw "the published pack is $($head.Headers['Content-Length']) bytes, worker/models.json pins $($entry.pack.size)" }
      # setup-runtime.ps1 reuses a FFmpeg zip in %TEMP% whose SHA-256 matches its pin (BtbN autobuild tags expire).
      - name: FFmpeg archive location
        id: ffmpeg
        shell: pwsh
        run: |
          $s = Get-Content scripts/setup-runtime.ps1 -Raw
          "path=$([IO.Path]::GetTempPath())$([regex]::Match($s, "FfmpegAsset = '([^']+)'").Groups[1].Value).zip" >> $env:GITHUB_OUTPUT
          "key=ffmpeg-$([regex]::Match($s, "FfmpegSha256 = '([^']+)'").Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.ffmpeg.outputs.path }}
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build private runtime (Python + FFmpeg)
        shell: pwsh
        timeout-minutes: 60  # a deadlocked OpenMP semantics test must not hold the runner for 6 h
        run: ./scripts/setup-runtime.ps1
      - name: SBOM and notices
        run: python scripts/third_party.py release
      - name: Build the native worker
        working-directory: worker-rs  # .cargo/config.toml (crt-static) and rust-toolchain.toml are read from here
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --release --locked
      - name: Stage the native worker (exe, ONNX Runtime, VC143 runtime)
        shell: pwsh
        run: ./scripts/stage-worker.ps1
      # tauri-build needs the bundled resources to exist, so test after the runtime is built.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --tests --locked
      - run: npm run tauri build -- --ci
        env:
          # Signs the installer for the in-app updater; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Update feed and checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          # GitHub renames assets with spaces/diacritics, so ship an ASCII name that SHA256SUMS can match.
          $name = 'ThanhAmStudio_' + ($exe.Name -replace '^.*?_', '')
          Copy-Item $exe.FullName (Join-Path release $name)
          # The in-app updater reads latest.json from the newest published release; its notes are the
          # bundled Vietnamese changelog entry, and the signature must name the tagged version.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($f in 'package.json', 'src-tauri/tauri.conf.json') { if ($version -ne (Get-Content $f -Raw | ConvertFrom-Json).version) { throw "tag $env:GITHUB_REF_NAME does not match $f" } }
          $entry = Get-Content src/changelog.vi.json -Raw -Encoding utf8 | ConvertFrom-Json | Where-Object version -eq $version
          if (-not $entry) { throw "src/changelog.vi.json has no entry for $version" }
          $feed = [ordered]@{
            version = $version
            notes = ($entry.changes | ForEach-Object { "- $_" }) -join "`n"
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture)
            platforms = @{ 'windows-x86_64' = [ordered]@{
              signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$name" } }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/latest.json'), ($feed | ConvertTo-Json -Depth 4))
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works as published.
          $sums = Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), (($sums -join "`n") + "`n"))
      # A draft prerelease until the Sandbox gate passes. Publish it with --prerelease=false --latest: the in-app
      # updater reads releases/latest, which skips drafts and prereleases.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME --draft --prerelease --title "Thanh Âm Studio $env:GITHUB_REF_NAME" --notes "Unsigned Windows x64 installer (CPU). Built from $env:GITHUB_SHA. See SHA256SUMS.txt, sbom.cdx.json and THIRD-PARTY-NOTICES.txt." (Get-ChildItem release -File).FullName

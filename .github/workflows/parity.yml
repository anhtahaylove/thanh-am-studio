name: parity
# The Rust worker against the v1.0.16 Python goldens (worker-rs/parity/README.md), and against the Python worker run on the same runner
# for preset TTS (job tts). The other engine rows (D, Z) are added as their code lands. The x09-500 recipes (500 recorded takes) run at
# the release gate, not here.
on:
  push:
    branches: [main]
    paths: ['worker-rs/**', 'worker/models.json', 'worker/main.py', 'worker/requirements-*.lock', 'scripts/setup-runtime.ps1', 'scripts/stage-worker.ps1', '.github/workflows/parity.yml']
  pull_request:
    paths: ['worker-rs/**', 'worker/models.json', 'worker/main.py', 'worker/requirements-*.lock', 'scripts/setup-runtime.ps1', 'scripts/stage-worker.ps1', '.github/workflows/parity.yml']
permissions:
  contents: read
jobs:
  rows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        # cargo reads .cargo/config.toml (dynamic CRT) from the working directory.
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy # worker-rs/rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-rs
      - run: cargo build --release --locked
      # The goldens were recorded with the FFmpeg build that setup-runtime.ps1 pins: fetch that build and check its SHA-256.
      - name: FFmpeg pin
        id: ffmpeg
        run: |
          $s = Get-Content ../scripts/setup-runtime.ps1 -Raw
          foreach ($k in 'FfmpegTag', 'FfmpegAsset', 'FfmpegSha256') { "$k=$([regex]::Match($s, "$k = '([^']+)'").Groups[1].Value)" >> $env:GITHUB_OUTPUT }
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ${{ runner.temp }}/ffmpeg-parity
          key: ffmpeg-parity-${{ steps.ffmpeg.outputs.FfmpegSha256 }}
      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ steps.ffmpeg.outputs.FfmpegTag }}/${{ steps.ffmpeg.outputs.FfmpegAsset }}.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '${{ steps.ffmpeg.outputs.FfmpegSha256 }}') { throw 'FFmpeg archive checksum mismatch.' }
          $unpack = Join-Path $env:RUNNER_TEMP 'ffmpeg-unpack'
          Expand-Archive $zip $unpack
          Copy-Item (Join-Path $unpack '${{ steps.ffmpeg.outputs.FfmpegAsset }}/bin') (Join-Path $env:RUNNER_TEMP 'ffmpeg-parity') -Recurse
      # The two Opus recipes run in job tts, against the Python worker on that runner (libopus picks its code paths by CPU).
      - name: Row X (render and probe)
        run: python -I parity/x_compare.py --exe target/release/thanham-worker.exe --ffmpeg "$env:RUNNER_TEMP/ffmpeg-parity/ffmpeg.exe" --ffprobe "$env:RUNNER_TEMP/ffmpeg-parity/ffprobe.exe" --skip x05-format-opus
      - name: Row R (protocol and errors)
        if: ${{ !cancelled() }}
        run: python -I parity/r_compare.py --exe target/release/thanham-worker.exe
      # Models come through the Rust downloader itself, so a download regression also fails here; turbo (1.6 GB) is left to the gate.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-models
          key: parity-models-${{ hashFiles('worker/models.json') }}
      - name: Fetch models
        if: ${{ !cancelled() }}
        run: python -I parity/fetch_models.py --exe target/release/thanham-worker.exe --models "$env:RUNNER_TEMP/parity-models" --skip whisper-turbo
      - name: Row W (download)
        if: ${{ !cancelled() }}
        run: python -I parity/w_compare.py --exe target/release/thanham-worker.exe --models "$env:RUNNER_TEMP/parity-models"
  tts:
    # Rows L, P1, P3, P4, P5 and P-op for preset TTS. The Python reference is made here, by the private runtime that setup-runtime.ps1
    # builds (as release.yml does), so both workers run on the same CPU and every comparison is bitwise.
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      PY: ${{ github.workspace }}/runtime/python/python.exe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/requirements-*.lock
      - name: FFmpeg archive location
        id: ffmpeg
        run: |
          $s = Get-Content scripts/setup-runtime.ps1 -Raw
          "path=$([IO.Path]::GetTempPath())$([regex]::Match($s, "FfmpegAsset = '([^']+)'").Groups[1].Value).zip" >> $env:GITHUB_OUTPUT
          "key=ffmpeg-$([regex]::Match($s, "FfmpegSha256 = '([^']+)'").Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.ffmpeg.outputs.path }}
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build private runtime (Python + FFmpeg)
        run: ./scripts/setup-runtime.ps1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy # worker-rs/rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-rs
      # The staged folder is the installer's worker/ folder: the exe, the runtime's onnxruntime.dll, the VC143 DLLs and the registry.
      - name: Build and stage the worker
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location worker-rs
          cargo build --release --locked
          Pop-Location
          ./scripts/stage-worker.ps1
          Copy-Item worker/models.json worker-rs/stage/
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-models-vieneu
          key: parity-models-vieneu-${{ hashFiles('worker/models.json') }}
      - name: Fetch the VieNeu model
        run: '& $env:PY -I worker-rs/parity/fetch_models.py --exe worker-rs/stage/thanham-worker.exe --models "$env:RUNNER_TEMP/parity-models-vieneu" --only vieneu-v3'
      # The tts:: tests include the Rust form of test_clone_preview_matches_what_synthesis_enrolls, which needs FFmpeg.
      - name: Rows L and P1 (text checks, pause marks, chunks, phonemes and token ids)
        env:
          THANHAM_TTS_MODEL: ${{ runner.temp }}/parity-models-vieneu/vieneu-v3
          THANHAM_FFMPEG: ${{ github.workspace }}/runtime/ffmpeg/ffmpeg.exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:THANHAM_TTS_CASES = "$env:RUNNER_TEMP/tts-cases.jsonl"
          $env:THANHAM_PYTHON = $env:PY
          & $env:PY -I -X utf8 worker-rs/parity/tts_corpus.py . "$env:RUNNER_TEMP/tts-corpus.jsonl"
          & $env:PY -I -X utf8 worker-rs/parity/tts_cases.py --corpus "$env:RUNNER_TEMP/tts-corpus.jsonl" --model $env:THANHAM_TTS_MODEL --out $env:THANHAM_TTS_CASES
          Push-Location worker-rs
          cargo test --release --locked tts:: -- --nocapture
          Pop-Location
      - name: Rows P-op, P3, P4 and P5 (seeded Python and Rust tts on this runner)
        if: ${{ !cancelled() }}
        env:
          THANHAM_TTS_MODEL: ${{ runner.temp }}/parity-models-vieneu/vieneu-v3
        run: '& $env:PY -I worker-rs/parity/tts_op.py --python $env:PY --exe worker-rs/stage/thanham-worker.exe --model $env:THANHAM_TTS_MODEL --ffmpeg runtime/ffmpeg/ffmpeg.exe --items worker-rs/parity/tts/items.json --out "$env:RUNNER_TEMP/tts-op"'
      # Cloned voices: references made here from preset takes (no recording in the repository), then seeded cloned tts, every
      # enrollment step (K-cond) and clone_preview on every reference, Python against Rust.
      - name: Rows P-op and K-cond (cloned tts and clone_preview on this runner)
        if: ${{ !cancelled() }}
        env:
          THANHAM_TTS_MODEL: ${{ runner.temp }}/parity-models-vieneu/vieneu-v3
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PY -I worker-rs/parity/clone_refs.py --python $env:PY --model $env:THANHAM_TTS_MODEL --ffmpeg runtime/ffmpeg/ffmpeg.exe --out "$env:RUNNER_TEMP/clone-refs"
          & $env:PY -I worker-rs/parity/tts_op.py --python $env:PY --exe worker-rs/stage/thanham-worker.exe --model $env:THANHAM_TTS_MODEL --ffmpeg runtime/ffmpeg/ffmpeg.exe --items worker-rs/parity/tts/clone_items.json --refs "$env:RUNNER_TEMP/clone-refs" --previews --out "$env:RUNNER_TEMP/tts-clone"
      - name: Row X Opus recipes (against the Python worker on this runner)
        if: ${{ !cancelled() }}
        run: '& $env:PY -I worker-rs/parity/x_compare.py --exe worker-rs/stage/thanham-worker.exe --ffmpeg runtime/ffmpeg/ffmpeg.exe --only x05-format-opus --opus-python $env:PY --main worker/main.py'
      # Row F: the fixtures are recorded again here by the private runtime's onnxruntime, so the comparison is exact on this CPU.
      - name: Row F (ORT FFI against Python's onnxruntime on this runner)
        if: ${{ !cancelled() }}
        env:
          ORTFFI_REQUIRE: '1'
          ORTFFI_VIENEU: ${{ runner.temp }}/parity-models-vieneu/vieneu-v3
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PY -I worker-rs/crates/ortffi/tools/gen_fixtures.py --runtime runtime/python --vieneu $env:ORTFFI_VIENEU --out worker-rs/crates/ortffi/fixtures
          Push-Location worker-rs
          cargo test -p ortffi --locked
          Pop-Location
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: tts-parity
          path: |
            ${{ runner.temp }}/tts-op/*.json
            ${{ runner.temp }}/tts-op/*.jsonl
            ${{ runner.temp }}/tts-op/*.log
            ${{ runner.temp }}/tts-op/*.csv
            ${{ runner.temp }}/tts-clone/*.json
            ${{ runner.temp }}/tts-clone/*.jsonl
            ${{ runner.temp }}/tts-clone/*.log
            ${{ runner.temp }}/tts-clone/preview-*/*.jsonl
            ${{ runner.temp }}/tts-clone/preview-*/*.log
          if-no-files-found: ignore

name: runtime
# Builds the private runtime as release.yml does and runs the worker tests on it, so a worker or lock change
# meets the real packages (soundfile, VieNeu, FFmpeg) on every PR instead of first at tag time. It also builds the
# separation profile (the input of the downloadable pack, see pack.yml) and runs the separation tests on it.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'worker-rs/**', 'scripts/stage-worker.ps1', 'scripts/setup-runtime.ps1', 'scripts/openmp-shim/**', 'scripts/encoder-stubs/**', '.github/workflows/runtime.yml']
  pull_request:
    paths: ['worker/**', 'worker-rs/**', 'scripts/stage-worker.ps1', 'scripts/setup-runtime.ps1', 'scripts/openmp-shim/**', 'scripts/encoder-stubs/**', '.github/workflows/runtime.yml']
permissions:
  contents: read
jobs:
  worker:
    runs-on: windows-latest
    # A deadlocked OpenMP semantics test or worker test must not hold the runner for the 6 h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: worker/requirements-*.lock
      # setup-runtime.ps1 reuses a FFmpeg zip in %TEMP% whose SHA-256 matches its pin.
      - name: FFmpeg archive location
        id: ffmpeg
        shell: pwsh
        run: |
          $s = Get-Content scripts/setup-runtime.ps1 -Raw
          "path=$([IO.Path]::GetTempPath())$([regex]::Match($s, "FfmpegAsset = '([^']+)'").Groups[1].Value).zip" >> $env:GITHUB_OUTPUT
          "key=ffmpeg-$([regex]::Match($s, "FfmpegSha256 = '([^']+)'").Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.ffmpeg.outputs.path }}
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build private runtime (Python + FFmpeg)
        shell: pwsh
        run: ./scripts/setup-runtime.ps1
      - name: Worker tests on the private runtime
        shell: pwsh
        run: |
          $env:Path = "$PWD\runtime\ffmpeg;$env:Path"
          .\runtime\python\python.exe -m unittest discover -s worker/tests -v
      - name: The installer's runtime carries no torch
        shell: pwsh
        run: |
          .\runtime\python\python.exe -I -c "import importlib.util as u, sys; sys.exit(1 if any(u.find_spec(n) for n in ('torch', 'demucs', 'julius', 'einops', 'safetensors')) else 0)"
          if ($LASTEXITCODE -ne 0) { throw 'torch or a Demucs package is in the base runtime' }
      - name: Build the separation runtime (the pack's input)
        shell: pwsh
        run: ./scripts/setup-runtime.ps1 -Profile separation
      - name: Separation tests on the separation runtime
        shell: pwsh
        run: |
          $env:Path = "$PWD\runtime\ffmpeg;$env:Path"
          .\runtime-separation\python\python.exe -B -I -m unittest discover -s worker/tests -p test_worker.py -k separat -v
      # The staged folder is what the installer ships beside main.py: the exe must load the runtime's ONNX Runtime from it.
      - name: Native worker health on the staged files
        shell: pwsh
        run: |
          Push-Location worker-rs
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --release --locked
          Pop-Location
          ./scripts/stage-worker.ps1
          $health = & worker-rs\stage\thanham-worker.exe health | ConvertFrom-Json
          $health | ConvertTo-Json -Depth 5
          if (-not $health.ort.loaded -or $LASTEXITCODE -ne 0) { throw 'The native worker did not load ONNX Runtime.' }

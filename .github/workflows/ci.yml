name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # src-tauri/rust-toolchain.toml pins the compiler (1.100.0, which built v1.0.20), as worker-rs pins its own.
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: node e2e/desktop/nvdalog.mjs --self-test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Placeholder bundle resources (tauri-build checks they exist)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/python, runtime/ffmpeg, worker-rs/stage, release | Out-Null
          New-Item -ItemType File -Force release/THIRD-PARTY-NOTICES.txt | Out-Null
      # Run from src-tauri: rustup reads rust-toolchain.toml from the working directory, not from --manifest-path.
      # No `cargo fmt --check`: the dense house style is not rustfmt's.
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --tests --locked
        working-directory: src-tauri
      # numpy pinned as in worker/requirements-base.lock (peak limiter test).
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s worker/tests -v
  worker-rs:
    runs-on: windows-latest
    defaults:
      run:
        # cargo reads .cargo/config.toml (dynamic CRT) from the working directory, not from --manifest-path.
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # worker-rs/rust-toolchain.toml pins the compiler (rustup does not install a missing one by itself).
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The wheels give the pinned onnxruntime.dll, sherpa's older one and the Silero asset at <venv>/Lib/site-packages. The VieNeu
      # tests need the 600 MB model and skip here; parity.yml runs them with ORTFFI_REQUIRE=1.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The venv, and TEMP while the tests run, sit in a folder named outside cp1252 and cp1258 (a Vietnamese user profile): a DLL,
      # model or temp file reached through a narrow (ANSI) path fails here. docs/STATUS.md, "Unicode paths".
      - name: ORT inputs for the ortffi tests
        env:
          ORTVENV: ${{ runner.temp }}/Thử nghiệm ễ 中文/ortvenv
        run: |
          python -m venv "$env:ORTVENV"
          & "$env:ORTVENV/Scripts/python.exe" -m pip install --no-deps onnxruntime==1.31.1 faster-whisper==1.2.1 sherpa-onnx==2.0.1 sherpa-onnx-core==2.0.1
      # `cargo test` builds no exe for a package without integration tests; the worker's diarization test runs this one.
      - run: cargo build -p thanham-diarize --locked
      - run: cargo test --workspace --locked
        env:
          ORTFFI_RUNTIME: ${{ runner.temp }}/Thử nghiệm ễ 中文/ortvenv
          # thanham-diarize loads the wheel's sherpa-onnx-c-api.dll from here (its smoke test; no models in this job).
          THANHAM_SHERPA_LIB: ${{ runner.temp }}/Thử nghiệm ễ 中文/ortvenv/Lib/site-packages/sherpa_onnx/lib
          THANHAM_DIARIZE_REQUIRE: '1'  # built in the step above
          TEMP: ${{ runner.temp }}\Thử nghiệm ễ 中文
          TMP: ${{ runner.temp }}\Thử nghiệm ễ 中文
  # A pull request may not touch the workers, the Tauri files that build or store audio, or the workflows without a reviewed approval
  # (.github/guard-approvals/<PR>.txt, written by the coordinator), and never the owner-locked payload snapshot.
  # The logic lives in .github/guard.sh so it can be tested locally; the base branch's copy runs when it exists.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guarded paths match the approvals
        shell: bash
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD: HEAD
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The base branch's guard judges the pull request, so a PR cannot weaken the check that judges it (fallback: the first PR, D0).
          if git cat-file -e "$BASE:.github/guard.sh" 2>/dev/null; then git show "$BASE:.github/guard.sh" > "$RUNNER_TEMP/guard.sh"; else cp .github/guard.sh "$RUNNER_TEMP/guard.sh"; fi
          bash "$RUNNER_TEMP/guard.sh"

[package]
name = "reqwest-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The reqwest the updater already pulls (src-tauri/Cargo.lock: 0.13.5) with rustls + ring (src-tauri's rustls provider) and the OS proxy settings.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

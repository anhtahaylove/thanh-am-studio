[package]
name = "s5-clone"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Thanh Am Studio Rust migration spike S5: Rust clone conditioning (K-cond) and the B3 trim port (K-B3)"
publish = false

# Own workspace so this spike never joins src-tauri's or the ortffi spike's.
[workspace]

[dependencies]
# Reused unmodified from branch spike/ortffi (worktree outputs/wt/rust-ortffi).
ortffi = { path = "../../../rust-ortffi/spikes/ortffi" }
realfft = "3"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[profile.release]
debug = false

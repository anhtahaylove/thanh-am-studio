# Own workspace and lock file: never joins src-tauri's.
[workspace]
resolver = "2"
members = [".", "crates/ortffi"]

[package]
name = "thanham-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Thanh Am Studio native worker: protocol v1 on stdin/stdout, same events and codes as worker/main.py"
publish = false

[[bin]]
name = "thanham-worker"
path = "src/main.rs"

[dependencies]
ortffi = { path = "crates/ortffi" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# The reqwest the updater already pulls (src-tauri/Cargo.lock), with ring and the Windows certificate store and proxy settings.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The TTS front end, pinned as in spike S2 (row P1: 30,992/30,992 lines identical to Python): the sea_g2p 0.10.0 wheel's commit and the
# tokenizers 0.23.3 tag, with fancy-regex instead of the wheel's Oniguruma (319,166 fuzz inputs identical).
sea-g2p-rs = { git = "https://github.com/pnnbao97/sea-g2p", rev = "dae5ca83ea45f356c43bdb70a1bcd42e8729ff16", default-features = false }
tokenizers = { git = "https://github.com/huggingface/tokenizers", tag = "v0.23.3", default-features = false, features = ["fancy-regex"] }
regex = "1"
# The STT glue (stt/glue.rs, from spike S4): the log-Mel FFT, and stock C zlib for the compression ratio, which decides the
# temperature fallback at 2.4 (zlib-rs gave other compressed lengths than CPython's zlib in S4, off by up to 0.045).
realfft = "=3.5.1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", default-features = false, features = ["static", "libc"] }
# The STT engine (feature `ct2`): CTranslate2 4.8.5 linked against the prebuilt engine of engine/build-engine.ps1 (plan section 3),
# not built by the crate; MKL declared directly so Cargo unifies its features (static, ILP64, threaded through the OpenMP shim).
ct2rs-sys = { version = "=0.11.2", default-features = false, features = ["system", "mkl", "openmp-runtime-intel"], optional = true }
intel-onemkl-prebuild = { version = "=0.2.2", features = ["system", "openmp"], optional = true }

[features]
# Links the STT engine. The exe then needs the OpenMP shim libiomp5md.dll and libomp.dll beside it, so the release build leaves it
# off until STT is routed to this worker; parity.yml builds and checks it.
ct2 = ["dep:ct2rs-sys", "dep:intel-onemkl-prebuild"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
